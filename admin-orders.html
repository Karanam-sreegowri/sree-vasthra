// Admin Statistics

function updateAdminStats() {

    document.getElementById("totalOrders").textContent =
        orders.length;

    document.getElementById("pendingOrders").textContent =
        orders.filter(order =>
            order.status === "Order Placed" ||
            order.status === "Order Confirmed"
        ).length;

    document.getElementById("shippedOrders").textContent =
        orders.filter(order =>
            order.status === "Shipped" ||
            order.status === "Out for Delivery"
        ).length;

    document.getElementById("deliveredOrders").textContent =
        orders.filter(order =>
            order.status === "Delivered"
        ).length;
    document.getElementById("cancelledOrders").textContent =
        orders.filter(order =>
            order.status === "Cancelled"
        ).length;
}
updateAdminStats();

const ordersPerPage = 10;
let currentOrderPage = 1;
let currentDisplayedOrders = [];
function displayOrders(orderList) {
    adminOrdersList.innerHTML = "";
    const ordersPerPage = 10;
    const totalPages = Math.ceil(orderList.length / ordersPerPage);
    if (currentOrderPage > totalPages && totalPages > 0) {
        currentOrderPage = totalPages;
    }
    if (orderList.length === 0) {
        const hasOrders = orders.length > 0;
        if (hasOrders) {
            adminOrdersList.innerHTML = `
                <div class="no-orders">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <h2>No Matching Orders</h2>
                    <p>
                        No orders match your current search or filter.
                    </p>
                    <button
                        type="button"
                        onclick="
                            document.getElementById('orderSearch').value = '';
                            document.getElementById('statusFilter').value = 'All';
                            document.getElementById('sortOrders').value = 'newest';
                            filterOrders();
                        ">
                        Clear Search & Filters
                    </button>
                </div>
            `;
        } else {
            adminOrdersList.innerHTML = `
                <div class="no-orders">
                    <i class="fa-solid fa-box-open"></i>
                    <h2>No Orders Yet</h2>
                    <p>
                        There are currently no customer orders.
                    </p>
                </div>
            `;
        }
        return;
    }
    const startIndex =
        (currentOrderPage - 1) * ordersPerPage;
    const pageOrders =
        orderList
            .slice()
            .reverse()
            .slice(
                startIndex,
                startIndex + ordersPerPage
            );

        adminOrdersList.innerHTML += `

                        ? "status-shipped"
                        : order.status === "Out for Delivery"
                        ? "status-out"
                        : order.status === "Delivered"
                        ? "status-delivered"
                        : "status-cancelled"
                }">
                    ${order.status}
                </div>
                <div class="admin-customer">
                    <p>
                        <strong>Customer:</strong>
                        ${order.name}
                    </p>
                    <p>
                        <strong>Email:</strong>
                        ${order.email}
                    </p>
                    <p>
                        <strong>Phone:</strong>
                        ${order.phone}
                    </p>
                    <p>
                        <strong>Date:</strong>
                        ${order.date}
                    </p>
                    <p>
                        <strong>Address:</strong>
                        ${order.address}
                    </p>
                    <p>
                        <strong>Payment:</strong>
                        ${order.paymentMethod}
                    </p>
                </div>
                <div class="admin-products">
                    <h3>🛍️ Ordered Products</h3>
                    ${
                        order.products &&
                        order.products.length > 0
                        ?

                            return `

                                        ${product.name}

                                        Qty: ${product.quantity}

// =======================
// Order Pagination
// =======================
function renderOrderPagination(totalOrders) {
    const pagination =
        document.getElementById("orderPagination");
    if (!pagination) {
        return;
    }
    const ordersPerPage = 10;
    const totalPages =
        Math.ceil(totalOrders / ordersPerPage);
    pagination.innerHTML = "";
    if (totalPages <= 1) {
        return;
    }
    const container =
        document.createElement("div");
    container.className = "pagination";
    // Previous button
    const previousButton =
        document.createElement("button");
    previousButton.type = "button";
    previousButton.textContent = "← Previous";
    previousButton.disabled =
        currentOrderPage === 1;
    previousButton.addEventListener(
        "click",
        function() {
            if (currentOrderPage > 1) {
                currentOrderPage--;
                filterOrders();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );
    container.appendChild(previousButton);
    // Page buttons
    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {
        const pageButton =
            document.createElement("button");
        pageButton.type = "button";
        pageButton.textContent = page;
        if (page === currentOrderPage) {
            pageButton.classList.add("active");
        }
        pageButton.addEventListener(
            "click",
            function() {
                currentOrderPage = page;
                filterOrders();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        );
        container.appendChild(pageButton);
    }
    // Next button
    const nextButton =
        document.createElement("button");
    nextButton.type = "button";
    nextButton.textContent = "Next →";
    nextButton.disabled =
        currentOrderPage === totalPages;
    nextButton.addEventListener(
        "click",
        function() {
            if (currentOrderPage < totalPages) {
                currentOrderPage++;
                filterOrders();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }
    );
    container.appendChild(nextButton);
    pagination.appendChild(container);
}

// =======================
// Search + Status Filter
// =======================
const orderSearch =
    document.getElementById("orderSearch");
const statusFilter =
    document.getElementById("statusFilter");
const sortOrders =
    document.getElementById("sortOrders");
function filterOrders(resetPage = true) {
    if (resetPage) {
        currentOrderPage = 1;
    }
    const searchText =
        orderSearch.value.toLowerCase().trim();
    const selectedStatus =
        statusFilter.value;
    const selectedSort =
        sortOrders.value;
    let filteredOrders =
        orders.filter(function(order) {
            const matchesSearch =
                order.orderId.toLowerCase().includes(searchText) ||
                order.name.toLowerCase().includes(searchText) ||
                order.email.toLowerCase().includes(searchText) ||
                order.phone.toLowerCase().includes(searchText);
            const matchesStatus =
                selectedStatus === "All" ||
                order.status === selectedStatus;
            return matchesSearch && matchesStatus;
        });
    // =======================
    // Sort Orders
    // =======================
    if (selectedSort === "newest") {
        filteredOrders.sort(function(a, b) {
            return new Date(b.date) - new Date(a.date);
        });
    }
    else if (selectedSort === "oldest") {
        filteredOrders.sort(function(a, b) {
            return new Date(a.date) - new Date(b.date);
        });
    }
    else if (selectedSort === "highest") {
        filteredOrders.sort(function(a, b) {
            return Number(b.total) - Number(a.total);
        });
    }
    else if (selectedSort === "lowest") {
        filteredOrders.sort(function(a, b) {
            return Number(a.total) - Number(b.total);
        });
    }
    displayOrders(filteredOrders);
}
orderSearch.addEventListener(
    "input",
    filterOrders
);
statusFilter.addEventListener(
    "change",
    filterOrders
);
sortOrders.addEventListener(
    "change",
    filterOrders
);
// =======================
// Update Order Status
// =======================
function attachStatusButtons() {
    document
        .querySelectorAll(".update-status")
        .forEach(function(button) {
            button.addEventListener(
                "click",
                function() {
                    const orderId =
                        this.dataset.orderId;
                    const select =
                        document.querySelector(
                            `.status-select[data-order-id="${orderId}"]`
                        );
                    const newStatus =
                        select.value;
                    // Find the order
                    const order =
                        orders.find(function(item) {
                            return item.orderId === orderId;
                        });
                    if (!order) {
                        return;
                    }
                // Prevent cancelled orders from being changed
                if (order.status === "Cancelled") {
                    alert("Cancelled orders cannot be updated.");
                    return;
                }
                // Update status
                order.status = newStatus;
                    // Save orders
                    localStorage.setItem(
                        "orderHistory",
                        JSON.stringify(orders)
                    );
                    // Update dashboard statistics
                    updateAdminStats();
                    // Update lastOrder
                    const lastOrder =
                        JSON.parse(
                            localStorage.getItem("lastOrder")
                        );
                    if (
                        lastOrder &&
                        lastOrder.orderId === orderId
                    ) {
                        lastOrder.status = newStatus;
                        localStorage.setItem(
                            "lastOrder",
                            JSON.stringify(lastOrder)
                        );
                    }
                    alert(
                        "Order status updated successfully!"
                    )
                }
            );
        });
    }
// =======================
// Cancel Order
// =======================
document
    .querySelectorAll(".cancel-order")
    .forEach(function(button) {
        button.addEventListener("click", function() {
            const orderId =
                this.dataset.orderId;
            const order =
                orders.find(function(item) {
                    return item.orderId === orderId;
                });
            if (!order) {
                return;
            }
            if (order.status === "Delivered") {
                alert(
                    "Delivered orders cannot be cancelled."
                );
                return;
            }
            if (order.status === "Cancelled") {
                alert(
                    "This order is already cancelled."
                );
                return;
            }
            const confirmed =
                confirm(
                    "Are you sure you want to cancel Order " +
                    order.orderId +
                    "?"
                );
            if (!confirmed) {
                return;
            }
            order.status = "Cancelled";
            localStorage.setItem(
                "orderHistory",
                JSON.stringify(orders)
            );
            localStorage.setItem(
                "lastOrder",
                JSON.stringify(order)
            );
            displayOrders(orders);
            alert(
                "Order " +
                order.orderId +
                " has been cancelled."
            );
        });
    });
function downloadInvoice(orderId) {
