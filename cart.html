<nav>

<section class="cart-page">

<h1>Your Shopping Cart</h1>

<table>

<thead>

<tr>

<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>

</tr>

</thead>

<tbody id="cart-items">

</tbody>
</table>
<div class="coupon-box">

    <input
        type="text"
        id="coupon"
        placeholder="Enter Coupon Code">

    <button id="applyCoupon">
        Apply
    </button>

</div>
<div class="grand-total">

<h2 id="grand-total">grand-total : ₹0</h2>

<a href="checkout.html">
    <button>Proceed to Checkout</button>
</a>
<button id="clearCart">
    Clear Cart
</button>

</div>

</section>

<footer class="footer">

</footer>
