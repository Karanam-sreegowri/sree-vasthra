<section class="product-details">
    <div class="product-image">
        <img src="images/pink kurta.webp" alt="Pink Kurti">
    </div>
    <div class="product-info">
        <h1>Pink Kurti</h1>
            <div class="rating">
                ⭐⭐⭐⭐⭐
            </div>
                <h2>₹999</h2>
                <p>
                     Beautiful cotton kurti perfect for casual wear and festive occasions.
                </p>
                <label>Size:</label>
                <select>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
                <br><br>
                    <button>Add to Cart</button>
                    <button>Buy Now</button>
                    <hr><br>
                    <div class="delivery-check">
                        <h3>Check Delivery</h3>
                        <input
                        type="text"
                        id="pincode"
                        placeholder="Enter Pincode">
                        <button id="checkDelivery">
                             Check
                        </button>
                        <p id="deliveryResult"></p>
                    </div>
    </div>
</section>
<section class="related-products">
    <h2>Frequently Bought Together</h2>
    <div class="related-container">
        <div class="related-card">
            <img src="images/sharara-set.jpg">
            <h4>Sharara Set</h4>
            <p>₹2599</p>
        </div>
        <div class="related-card">
            <img src="images/party-gown.jpg">
            <h4>Party Gown</h4>
            <p>₹699</p>
        </div>
        <div class="related-card">
            <img src="images/indo-western wear.jpg">
            <h4>Indo-Western Wear</h4>
            <p>₹1599</p>
        </div>
    </div>
</section>
<section class="reviews">
    <h2>Customer Reviews</h2>
    <div id="reviewList">
        <div class="review">
            <h4>Priya ⭐⭐⭐⭐⭐</h4>
            <p>Excellent quality. Loved the fabric!</p>
        </div>
    </div>
    <h3>Write a Review</h3>
    <input
        type="text"
        id="reviewName"
        placeholder="Your Name">
    <textarea
        id="reviewText"
        placeholder="Write your review..."></textarea>
    <button id="submitReview">
        Submit Review
    </button>
</section>
