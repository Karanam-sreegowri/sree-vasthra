<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SREE VASTHRA</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background: #fff5f8;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .register-box h1 {
            text-align: center;
            color: #d81b75;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .register-box label {
            display: block;
            font-weight: 600;
            margin: 15px 0 7px;
        }

        .register-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .register-box input:focus {
            outline: none;
            border-color: #d81b75;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 45px;
        }

        .password-field i {
            position: absolute;
            right: 14px;
            top: 15px;
            cursor: pointer;
            color: #777;
        }

        .register-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #d81b75;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #b81460;
        }

        .register-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-footer a {
            color: #d81b75;
            font-weight: 600;
            text-decoration: none;
        }

        @media(max-width: 480px) {
            .register-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-box">

        <h1>Create Account</h1>

        <p class="register-subtitle">
            Join SREE VASTHRA and discover elegant ethnic wear.
        </p>

        <form id="registerForm">

            <label for="customerName">Full Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your full name"
                required
            >

            <label for="customerEmail">Email Address</label>
            <input
                type="email"
                id="customerEmail"
                placeholder="Enter your email"
                required
            >

            <label for="customerPhone">Phone Number</label>
            <input
                type="tel"
                id="customerPhone"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <label for="customerPassword">Password</label>

            <div class="password-field">
                <input
                    type="password"
                    id="customerPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <i class="fa-solid fa-eye"
                   onclick="togglePassword('customerPassword', this)">
                </i>
            </div>

            <label for="confirmPassword">Confirm Password</label>

            <div class="password-field">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >

                <i class="fa-solid fa-eye"
                   onclick="togglePassword('confirmPassword', this)">
                </i>
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <p id="registerMessage" class="register-message"></p>

        </form>

        <div class="register-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>

function togglePassword(inputId, icon) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

document.getElementById("registerForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("customerName").value.trim();
    const email = document.getElementById("customerEmail").value.trim().toLowerCase();
    const phone = document.getElementById("customerPhone").value.trim();
    const password = document.getElementById("customerPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("registerMessage");

    if (name.length < 3) {
        message.style.color = "red";
        message.textContent = "Please enter a valid full name.";
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        message.style.color = "red";
        message.textContent = "Enter a valid 10-digit phone number.";
        return;
    }

    if (password.length < 8) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    let customers = JSON.parse(
        localStorage.getItem("customers")
    ) || [];

    const existingCustomer = customers.find(
        customer => customer.email === email
    );

    if (existingCustomer) {
        message.style.color = "red";
        message.textContent = "This email is already registered.";
        return;
    }

    const newCustomer = {
        id: Date.now(),
        name: name,
        email: email,
        phone: phone,
        password: password
    };

    customers.push(newCustomer);

    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );

    message.style.color = "green";
    message.textContent = "Account created successfully!";

    document.getElementById("registerForm").reset();

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
